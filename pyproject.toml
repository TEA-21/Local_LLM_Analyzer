[project]
name = "companion-packager"
version = "0.1.0"
description = "Hardware-aware model analyzer, researcher, citation generator, and installer packager for Agent Companion"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.7.0",
    "psutil>=5.9.8",
    "py-cpuinfo>=9.0.0",
    "huggingface-hub>=0.23.0",
    "httpx>=0.27.0",
    "build>=1.2.0",
    "hatchling>=1.21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
companion-packager = "companion_packager.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]

